<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Health Dashboard - Cruise Recommender</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --status-up: #28a745;
            --status-down: #dc3545;
            --status-warning: #ffc107;
            --status-unknown: #6c757d;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 0;
        }
        
        .health-dashboard {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .dashboard-header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .status-up {
            background-color: var(--status-up);
            color: white;
        }
        
        .status-down {
            background-color: var(--status-down);
            color: white;
        }
        
        .status-warning {
            background-color: var(--status-warning);
            color: #000;
        }
        
        .status-unknown {
            background-color: var(--status-unknown);
            color: white;
        }
        
        .component-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .component-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
        }
        
        .component-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .component-name {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .component-icon {
            font-size: 24px;
        }
        
        .component-details {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }
        
        .detail-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e9ecef;
        }
        
        .detail-item:last-child {
            border-bottom: none;
        }
        
        .detail-label {
            font-weight: 500;
            color: #6c757d;
        }
        
        .detail-value {
            color: #333;
            font-family: 'Courier New', monospace;
        }
        
        .progress-bar-container {
            margin-top: 10px;
        }
        
        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: white;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-size: 24px;
            color: #667eea;
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .refresh-btn:hover {
            transform: rotate(180deg);
        }
        
        .loading-spinner {
            display: none;
            text-align: center;
            padding: 50px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            color: #6c757d;
            margin-top: 5px;
            font-size: 14px;
        }
        
        .disk-space-bar {
            height: 8px;
            border-radius: 4px;
            background: #e9ecef;
            overflow: hidden;
            margin-top: 10px;
        }
        
        .disk-space-fill {
            height: 100%;
            transition: width 0.3s;
        }
        
        .disk-space-low {
            background: var(--status-warning);
        }
        
        .disk-space-ok {
            background: var(--status-up);
        }
        
        .disk-space-critical {
            background: var(--status-down);
        }
    </style>
</head>
<body>
    <div class="health-dashboard">
        <div class="dashboard-header">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h1 class="mb-2">
                        <i class="bi bi-heart-pulse-fill text-danger"></i>
                        System Health Dashboard
                    </h1>
                    <p class="text-muted mb-0">Real-time monitoring of system components</p>
                </div>
                <div>
                    <span id="overall-status" class="status-badge status-unknown">Loading...</span>
                    <div class="mt-2 text-muted small">
                        <i class="bi bi-clock"></i> Last updated: <span id="last-update">-</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="loading-spinner" class="loading-spinner">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-3">Loading health data...</p>
        </div>
        
        <div id="dashboard-content" style="display: none;">
            <div class="stats-grid" id="stats-grid"></div>
            
            <h3 class="text-white mb-3">
                <i class="bi bi-list-check"></i> Component Status
            </h3>
            
            <div id="components-container"></div>
        </div>
    </div>
    
    <button class="refresh-btn" onclick="loadHealthData()" title="Refresh">
        <i class="bi bi-arrow-clockwise"></i>
    </button>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Detect API base path - handle both with and without context path
        let API_BASE = '';
        const currentPath = window.location.pathname;
        if (currentPath.startsWith('/api/v1')) {
            API_BASE = '/api/v1';
        } else if (currentPath.startsWith('/SoWR') || currentPath.includes('/social-web-recommender')) {
            // IntelliJ web server or other context
            API_BASE = 'http://localhost:8080/api/v1';
        } else {
            // Default to relative path
            API_BASE = '/api/v1';
        }
        
        const HEALTH_ENDPOINT = `${API_BASE}/actuator/health`;
        
        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }
        
        function formatPercentage(value) {
            return Math.round(value * 100) / 100 + '%';
        }
        
        function getStatusClass(status) {
            const statusUpper = status?.toUpperCase();
            if (statusUpper === 'UP') return 'status-up';
            if (statusUpper === 'DOWN') return 'status-down';
            if (statusUpper === 'WARNING' || statusUpper === 'YELLOW') return 'status-warning';
            return 'status-unknown';
        }
        
        function getComponentIcon(componentName) {
            const icons = {
                'db': 'bi-database',
                'diskSpace': 'bi-hdd',
                'elasticsearch': 'bi-search',
                'rabbit': 'bi-envelope',
                'redis': 'bi-lightning',
                'ping': 'bi-wifi',
                'livenessState': 'bi-heart',
                'readinessState': 'bi-check-circle'
            };
            return icons[componentName] || 'bi-gear';
        }
        
        function renderComponent(componentName, componentData) {
            const status = componentData.status || 'UNKNOWN';
            const details = componentData.details || {};
            const statusClass = getStatusClass(status);
            const icon = getComponentIcon(componentName);
            
            let detailsHtml = '';
            
            // Special handling for disk space
            if (componentName === 'diskSpace' && details.free !== undefined && details.total !== undefined) {
                const used = details.total - details.free;
                const usedPercent = (used / details.total) * 100;
                const freePercent = (details.free / details.total) * 100;
                let barClass = 'disk-space-ok';
                if (freePercent < 10) barClass = 'disk-space-critical';
                else if (freePercent < 20) barClass = 'disk-space-low';
                
                detailsHtml = `
                    <div class="component-details">
                        <div class="detail-item">
                            <span class="detail-label">Total Space</span>
                            <span class="detail-value">${formatBytes(details.total)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Free Space</span>
                            <span class="detail-value">${formatBytes(details.free)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Used Space</span>
                            <span class="detail-value">${formatBytes(used)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Threshold</span>
                            <span class="detail-value">${formatBytes(details.threshold)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Path</span>
                            <span class="detail-value">${details.path || 'N/A'}</span>
                        </div>
                        <div class="progress-bar-container">
                            <div class="disk-space-bar">
                                <div class="disk-space-fill ${barClass}" style="width: ${usedPercent}%"></div>
                            </div>
                            <small class="text-muted">${formatPercentage(usedPercent)} used</small>
                        </div>
                    </div>
                `;
            }
            // Special handling for Elasticsearch
            else if (componentName === 'elasticsearch') {
                const clusterStatus = details.status || 'unknown';
                const clusterStatusClass = getStatusClass(clusterStatus);
                
                detailsHtml = `
                    <div class="component-details">
                        <div class="detail-item">
                            <span class="detail-label">Cluster Name</span>
                            <span class="detail-value">${details.cluster_name || 'N/A'}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Cluster Status</span>
                            <span class="detail-value"><span class="status-badge ${clusterStatusClass}">${clusterStatus}</span></span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Nodes</span>
                            <span class="detail-value">${details.number_of_nodes || 0} (${details.number_of_data_nodes || 0} data nodes)</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Active Shards</span>
                            <span class="detail-value">${details.active_shards || 0} / ${details.active_primary_shards || 0} primary</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Unassigned Shards</span>
                            <span class="detail-value">${details.unassigned_shards || 0}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Active Shards %</span>
                            <span class="detail-value">${details.active_shards_percent_as_number ? formatPercentage(details.active_shards_percent_as_number) : 'N/A'}</span>
                        </div>
                    </div>
                `;
            }
            // Generic component details
            else {
                const detailItems = Object.entries(details)
                    .filter(([key]) => !['status'].includes(key))
                    .map(([key, value]) => {
                        let displayValue = value;
                        if (typeof value === 'boolean') {
                            displayValue = value ? '<i class="bi bi-check-circle-fill text-success"></i> Yes' : '<i class="bi bi-x-circle-fill text-danger"></i> No';
                        } else if (typeof value === 'object') {
                            displayValue = JSON.stringify(value);
                        }
                        return `
                            <div class="detail-item">
                                <span class="detail-label">${key.replace(/([A-Z])/g, ' $1').trim()}</span>
                                <span class="detail-value">${displayValue}</span>
                            </div>
                        `;
                    }).join('');
                
                detailsHtml = detailItems ? `<div class="component-details">${detailItems}</div>` : '';
            }
            
            return `
                <div class="component-card">
                    <div class="component-header">
                        <div class="component-name">
                            <i class="bi ${icon} component-icon"></i>
                            ${componentName.charAt(0).toUpperCase() + componentName.slice(1).replace(/([A-Z])/g, ' $1')}
                        </div>
                        <span class="status-badge ${statusClass}">${status}</span>
                    </div>
                    ${detailsHtml}
                </div>
            `;
        }
        
        function renderStats(healthData) {
            const components = healthData.components || {};
            const componentCount = Object.keys(components).length;
            const upCount = Object.values(components).filter(c => c.status === 'UP').length;
            const downCount = Object.values(components).filter(c => c.status === 'DOWN').length;
            const warningCount = Object.values(components).filter(c => 
                c.status === 'WARNING' || c.status === 'YELLOW'
            ).length;
            
            // Calculate disk space percentage if available
            let diskUsage = null;
            if (components.diskSpace?.details) {
                const { total, free } = components.diskSpace.details;
                if (total && free) {
                    diskUsage = ((total - free) / total * 100).toFixed(1);
                }
            }
            
            return `
                <div class="stat-card">
                    <div class="stat-value">${componentCount}</div>
                    <div class="stat-label">Total Components</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value text-success">${upCount}</div>
                    <div class="stat-label">Healthy</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value text-warning">${warningCount}</div>
                    <div class="stat-label">Warning</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value text-danger">${downCount}</div>
                    <div class="stat-label">Down</div>
                </div>
                ${diskUsage !== null ? `
                <div class="stat-card">
                    <div class="stat-value">${diskUsage}%</div>
                    <div class="stat-label">Disk Usage</div>
                </div>
                ` : ''}
            `;
        }
        
        async function loadHealthData() {
            document.getElementById('loading-spinner').style.display = 'block';
            document.getElementById('dashboard-content').style.display = 'none';
            
            try {
                const response = await fetch(HEALTH_ENDPOINT);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const healthData = await response.json();
                
                // Update overall status
                const overallStatus = healthData.status || 'UNKNOWN';
                const overallStatusClass = getStatusClass(overallStatus);
                document.getElementById('overall-status').textContent = overallStatus;
                document.getElementById('overall-status').className = `status-badge ${overallStatusClass}`;
                
                // Update last update time
                document.getElementById('last-update').textContent = new Date().toLocaleTimeString();
                
                // Render stats
                document.getElementById('stats-grid').innerHTML = renderStats(healthData);
                
                // Render components
                const components = healthData.components || {};
                const componentsHtml = Object.entries(components)
                    .map(([name, data]) => renderComponent(name, data))
                    .join('');
                
                document.getElementById('components-container').innerHTML = componentsHtml;
                
                document.getElementById('loading-spinner').style.display = 'none';
                document.getElementById('dashboard-content').style.display = 'block';
                
            } catch (error) {
                console.error('Error loading health data:', error);
                document.getElementById('loading-spinner').innerHTML = `
                    <div class="alert alert-danger">
                        <h5><i class="bi bi-exclamation-triangle"></i> Error Loading Health Data</h5>
                        <p>${error.message}</p>
                        <button class="btn btn-primary" onclick="loadHealthData()">Retry</button>
                    </div>
                `;
            }
        }
        
        // Load data on page load
        document.addEventListener('DOMContentLoaded', loadHealthData);
        
        // Auto-refresh every 30 seconds
        setInterval(loadHealthData, 30000);
    </script>
</body>
</html>
