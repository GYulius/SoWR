# Spark Logging Configuration
status = warn
name = SparkPropertiesConfig

# Loggers
logger.app.name = org.apache.spark
logger.app.level = INFO

logger.rootLogger.level = INFO
logger.rootLogger.appenderRef.console.ref = Console

# Console Appender
appender.console.type = Console
appender.console.name = Console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

# File Appender (optional)
appender.file.type = File
appender.file.name = File
appender.file.fileName = /opt/bitnami/spark/work/logs/spark.log
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

