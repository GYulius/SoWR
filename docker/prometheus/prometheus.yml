global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'cruise-recommender'
    metrics_path: '/api/v1/actuator/prometheus'
    static_configs:
      - targets: ['app:8080']
        labels:
          application: 'social-web-recommender'
          environment: 'dev'

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
        labels:
          service: 'rabbitmq'

  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['elasticsearch:9200']
        labels:
          service: 'elasticsearch'

