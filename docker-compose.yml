# Project name for Docker Desktop stack grouping
name: sowr

services:
  mysql:
    image: mysql:8.0
    container_name: cruise_recommender_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"  # Using 3307 on host to avoid conflict with local MySQL on 3306
    environment:
      MYSQL_DATABASE: cruise_recommender
      MYSQL_USER: cruise_app
      MYSQL_PASSWORD: cruise_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - cruise_network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password

    # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: cruise_recommender_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cruise_network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cruise_recommender_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: cruise_app
      RABBITMQ_DEFAULT_PASS: cruise_rabbitmq_password_2024
      RABBITMQ_DEFAULT_VHOST: cruise_recommender
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - cruise_network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5

  # Grafana for Metrics Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: cruise_recommender_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - cruise_network
    depends_on:
      - prometheus
  
  # Prometheus for Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: cruise_recommender_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - cruise_network
  
  # Elasticsearch for AIS Data Storage and Search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: cruise_recommender_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - cruise_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Kibana for Elasticsearch Visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: cruise_recommender_kibana
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
    depends_on:
      - elasticsearch
    networks:
      - cruise_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Application
  app:
    build: .
    container_name: cruise_recommender_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: cruise_recommender
      DB_USER: cruise_app
      DB_PASSWORD: cruise_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: your_super_secret_jwt_key_here
      FRONTEND_URL: http://localhost:3000
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - cruise_network

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: cruise_recommender_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - app
    networks:
      - cruise_network

  # Apache Jena Fuseki - SPARQL Server
  # Documentation: https://jena.apache.org/documentation/fuseki2/fuseki-docker.html
  # Docker image: https://hub.docker.com/r/stain/jena-fuseki
  fuseki:
    image: stain/jena-fuseki:latest
    container_name: cruise_recommender_fuseki
    restart: unless-stopped
    ports:
      - "3030:3030"
    environment:
      # Fuseki admin credentials
      # Note: ADMIN_PASSWORD is set on FIRST startup only - delete volume to reset
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-admin}
      # JVM options for better performance
      # Adjust based on available memory
      JVM_ARGS: ${FUSEKI_JVM_ARGS:--Xmx2g -Xms1g}
    volumes:
      # Persistent storage for TDB2 databases
      - fuseki_data:/fuseki
      # Mount databases directory for direct access
      - ./docker/fuseki/databases:/fuseki/databases
      # Mount config file for TDB2 persistent dataset configuration
      - ./docker/fuseki/config.ttl:/fuseki/config.ttl:ro
    networks:
      - cruise_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3030/$/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # Note: Fuseki doesn't directly depend on MySQL
    # It uses TDB2 for storage, but can be configured to work alongside MySQL
    # depends_on:
    #   mysql:
    #     condition: service_healthy

  # Spark Master Node for Big Data Analytics
  spark-master:
    build:
      context: ./docker/spark
      dockerfile: Dockerfile
    container_name: cruise_recommender_spark_master
    hostname: spark-master
    restart: unless-stopped
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master
      --port 7077
      --webui-port 8080
    environment:
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
    ports:
      - "8080:8080"  # Spark Master Web UI
      - "7077:7077"  # Spark Master RPC Port
    volumes:
      - spark_master_data:/opt/spark/work
      - ./docker/spark/conf:/opt/spark/conf:ro
      - ./scripts:/workspace/scripts:ro
      - ./data:/workspace/data:ro
    networks:
      - cruise_network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Spark Worker Node 1
  spark-worker-1:
    build:
      context: ./docker/spark
      dockerfile: Dockerfile
    container_name: cruise_recommender_spark_worker_1
    hostname: spark-worker-1
    restart: unless-stopped
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --webui-port 8081
      --cores 2
      --memory 2g
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
    ports:
      - "8081:8081"  # Worker Web UI
    volumes:
      - spark_worker1_data:/opt/spark/work
      - ./docker/spark/conf:/opt/spark/conf:ro
      - ./scripts:/workspace/scripts:ro
      - ./data:/workspace/data:ro
    depends_on:
      - spark-master
    networks:
      - cruise_network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8081 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Spark Worker Node 2
  spark-worker-2:
    build:
      context: ./docker/spark
      dockerfile: Dockerfile
    container_name: cruise_recommender_spark_worker_2
    hostname: spark-worker-2
    restart: unless-stopped
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --webui-port 8081
      --cores 2
      --memory 2g
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
    ports:
      - "8082:8081"  # Worker Web UI
    volumes:
      - spark_worker2_data:/opt/spark/work
      - ./docker/spark/conf:/opt/spark/conf:ro
      - ./scripts:/workspace/scripts:ro
      - ./data:/workspace/data:ro
    depends_on:
      - spark-master
    networks:
      - cruise_network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8081 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # JupyterLab with PySpark 3.5.0 for Big Data Analytics
  jupyterlab:
    build:
      context: ./docker/jupyterlab
      dockerfile: Dockerfile
    container_name: cruise_recommender_jupyterlab
    hostname: jupyterlab
    restart: unless-stopped
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_DRIVER_MEMORY=2g
      - SPARK_EXECUTOR_MEMORY=2g
      - SPARK_EXECUTOR_CORES=2
      - PYSPARK_PYTHON=python3
      - PYSPARK_DRIVER_PYTHON=jupyter
      - PYSPARK_DRIVER_PYTHON_OPTS=lab
      - FUSEKI_ENDPOINT=http://fuseki:3030/cruise_kg/sparql
      - FUSEKI_UPDATE_ENDPOINT=http://fuseki:3030/cruise_kg/update
      - FUSEKI_USERNAME=${FUSEKI_ADMIN_USER:-admin}
      - FUSEKI_PASSWORD=${FUSEKI_ADMIN_PASSWORD:-admin}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE:-cruise_recommender}
      - MYSQL_USER=${MYSQL_USER:-cruise_app}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-cruise_password}
    ports:
      - "8888:8888"  # JupyterLab
    volumes:
      - jupyterlab_data:/home/jovyan/work
      - ./scripts:/home/jovyan/work/scripts:ro
      - ./data:/home/jovyan/work/data:ro
      - ./notebooks:/home/jovyan/work/notebooks:rw
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2
      - fuseki
      - mysql
    networks:
      - cruise_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  elasticsearch_data:
  grafana_data:
  prometheus_data:
  fuseki_data:
  spark_master_data:
  spark_worker1_data:
  spark_worker2_data:
  jupyterlab_data:

networks:
  cruise_network:
    driver: bridge
